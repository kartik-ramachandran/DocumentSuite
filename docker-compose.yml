services:
  pdfapi:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/workspace
      - viewer-settings:/data/settings
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - Tools__Poppler__PdfToPpmPath=/usr/bin/pdftoppm
      - Tools__Poppler__PdfToTextPath=/usr/bin/pdftotext
      - Tools__LibreOffice__SofficePath=/usr/bin/soffice
      - Tools__Browser__Path=/usr/bin/google-chrome-stable
      - SAL_USE_VCLPLUGIN=gen
      - Mcp__ApiKey=${MCP_API_KEY:-}
      - Mcp__WorkspaceRoot=/workspace
      - Settings__Path=/data/settings
      - Settings__WriteKey=${SETTINGS_WRITE_KEY:-}

volumes:
  viewer-settings:
